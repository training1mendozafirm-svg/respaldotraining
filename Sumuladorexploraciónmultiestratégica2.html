    <script>
// SCORM 1.2 API Wrapper
var SCORM = {
    API: null,
    
    findAPI: function(win) {
        var attempts = 0;
        var maxAttempts = 500;
        
        while (!win.API && win.parent && win.parent != win && attempts < maxAttempts) {
            attempts++;
            win = win.parent;
        }
        
        if (win.API) {
            return win.API;
        }
        
        if (window.opener) {
            return this.findAPI(window.opener);
        }
        
        return null;
    },
    
    init: function() {
        this.API = this.findAPI(window);
        
        if (this.API) {
            var result = this.API.LMSInitialize("");
            if (result == "true") {
                console.log("SCORM initialized successfully");
                this.setValue("cmi.core.lesson_status", "incomplete");
                this.setValue("cmi.core.score.min", "0");
                this.setValue("cmi.core.score.max", "100");
                return true;
            }
        }
        
        console.log("SCORM API not found - running in standalone mode");
        return false;
    },
    
    getValue: function(key) {
        if (this.API) {
            return this.API.LMSGetValue(key);
        }
        return "";
    },
    
    setValue: function(key, value) {
        if (this.API) {
            var result = this.API.LMSSetValue(key, value);
            if (result == "true") {
                this.commit();
            }
            return result == "true";
        }
        return false;
    },
    
    commit: function() {
        if (this.API) {
            return this.API.LMSCommit("") == "true";
        }
        return false;
    },
    
    setScore: function(score) {
        score = Math.max(0, Math.min(100, Math.round(score)));
        this.setValue("cmi.core.score.raw", score.toString());
        this.setValue("cmi.core.score.scaled", (score / 100).toFixed(2));
        
        if (score >= 80) {
            this.setValue("cmi.core.lesson_status", "passed");
        } else if (score >= 60) {
            this.setValue("cmi.core.lesson_status", "completed");
        } else {
            this.setValue("cmi.core.lesson_status", "failed");
        }
        
        return true;
    },
    
    setSuspendData: function(data) {
        if (typeof data === 'object') {
            data = JSON.stringify(data);
        }
        return this.setValue("cmi.suspend_data", data);
    },
    
    getSuspendData: function() {
        var data = this.getValue("cmi.suspend_data");
        try {
            return JSON.parse(data);
        } catch (e) {
            return null;
        }
    },
    
    setLocation: function(location) {
        return this.setValue("cmi.core.lesson_location", location.toString());
    },
    
    complete: function() {
        var status = this.getValue("cmi.core.lesson_status");
        
        if (status !== "passed" && status !== "failed") {
            this.setValue("cmi.core.lesson_status", "completed");
        }
        
        this.commit();
        return true;
    },
    
    terminate: function() {
        if (this.API) {
            this.commit();
            var result = this.API.LMSFinish("");
            return result == "true";
        }
        return false;
    }
};

window.addEventListener('beforeunload', function() {
    SCORM.terminate();
});

</script>

            for (let i = 1; i <= state.totalRounds; i++) {
                html += `
                    <div class="timeline-step">
                        <div class="step-number ${i === 1 ? 'active' : ''}" id="step-${i}">${i}</div>
                        <div class="step-info">
                            <div class="step-label ${i === 1 ? 'active' : ''}" id="step-label-${i}">Pregunta ${i}</div>
                            <div class="step-detail" id="step-detail-${i}">Pendiente</div>
                        </div>
                    </div>
                `;
            }
            
            timeline.innerHTML = html;
        }

        // Load Welcome
        function loadWelcome() {
            const content = `
                <div class="header">
                    <div class="header-icon">⚖️</div>
                    <h1 class="header-title">Exploración Multi-estratégica</h1>
                    <p class="header-subtitle">Simulador Paso a Paso de Identificación de Visas Alternativas</p>
                </div>

                <div class="case-container">
                    <h2 class="case-title">Caso: ${caseData.clientName}</h2>
                    
                    <div class="client-quote">
                        "Doctora, sé que mi caso VAWA tiene Prima Facie desde hace meses, pero sigo sin respuesta final. Estoy muy ansiosa porque tengo una orden de deportación de 1997. Mi amiga me dijo que hay otra visa que podría ayudarme, pero tengo miedo de empeorar mi situación. ¿Es verdad eso o me va a perjudicar?"
                    </div>

                    <div class="info-box">
                        <h3 class="info-box-title">📋 Información del Expediente:</h3>
                        <ul class="info-list">
                            <li>Caso VAWA con Prima Facie emitido (2022-2023)</li>
                            <li>Orden de deportación en frontera (1997, Honduras)</li>
                            <li>Última entrada a EE.UU.: 2010</li>
                            <li>Relación no casada legalmente: 18 años (2003-2021)</li>
                            <li>Tiene hijos (uno también sufrió maltrato)</li>
                            <li>Sin reportes policiales previos</li>
                        </ul>
                    </div>

                    <div class="mission-box">
                        <h3>🎯 Tu Misión:</h3>
                        <p>Determinar, mediante preguntas estratégicas, si la cliente puede aplicar a <strong>Visa T</strong> como vía alterna a la residencia, <strong>SIN abandonar</strong> su caso VAWA.</p>
                        <p><strong>La llamada es exitosa si logras:</strong></p>
                        <ul>
                            <li>Identificar indicios de elegibilidad para Visa T</li>
                            <li>Generar suficiente confianza para continuar con entrevista profunda</li>
                            <li>Acordar siguientes pasos claros (entrevista 2-3 horas, reporte FBI)</li>
                        </ul>
                    </div>

                    <div class="warning-box">
                        <h3>⚠️ Riesgo:</h3>
                        <p>Si no haces las preguntas correctas o avanzas muy rápido:
                        <br>• La cliente puede cerrarse emocionalmente
                        <br>• Puede no compartir información crítica sobre coerción sexual o servidumbre
                        <br>• Puede rechazar explorar Visa T por miedo al FBI o a perder VAWA</p>
                    </div>

                    <div class="btn-container">
                        <button class="btn btn-primary" onclick="startSimulation()">
                            Iniciar Llamada →
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('main-content').innerHTML = content;
        }

        // Start Simulation
        function startSimulation() {
            state.currentRound = 1;
            loadRound();
        }

        // Load Round
        function loadRound() {
            if (state.currentRound > state.totalRounds) {
                showResults();
                return;
            }

            const round = rounds[state.currentRound - 1];
            
            const conversationHTML = state.conversationHistory.length > 0 ? generateConversationHTML() : '';

            const content = `
                <div style="display: grid; grid-template-columns: 1fr 280px; gap: 25px;">
                    <div class="case-container">
                        ${conversationHTML}
                        
                        ${round.clientStatement ? `
                            <div class="message">
                                <div class="message-label" style="color: #3b82f6;">CLIENTE - ${caseData.clientName}</div>
                                <div class="client-message">
                                    <p class="message-text">${round.clientStatement}</p>
                                </div>
                            </div>
                        ` : ''}

                        <div class="question-section">
                            <h3 class="question-title">¿Cómo respondes?</h3>
                            ${round.options.map((opt, index) => `
                                <div class="option-card" onclick="selectOption(${index})">
                                    <p class="option-text">${opt.text}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    ${generateClientStatePanel()}
                </div>
            `;

            document.getElementById('main-content').innerHTML = content;
            updateStats();
        }

        // Select Option
        function selectOption(optionIndex) {
            const round = rounds[state.currentRound - 1];
            const option = round.options[optionIndex];

            // Update state
            state.trust = Math.max(0, Math.min(100, state.trust + option.impact.trust));
            state.frustration = Math.max(0, Math.min(100, state.frustration + option.impact.frustration));
            state.cooperation = Math.max(0, Math.min(100, state.cooperation + option.impact.cooperation));

            // Update score based on strategy
            if (option.type === 'validation') {
                state.score += 25;
                state.correctCount++;
            } else if (option.type === 'clarification') {
                state.score += 15;
            } else if (option.type === 'direct') {
                state.score += 5;
            } else if (option.type === 'premature') {
                state.score -= 10;
                state.wrongCount++;
            }

            state.score = Math.max(0, state.score);

            // Collect info
            if (option.infoGained) {
                state.infoCollected[option.infoGained] = true;
            }

            // Calculate progress
            const infoCount = Object.values(state.infoCollected).filter(v => v).length;
            state.progress = Math.min(100, (infoCount / 6) * 100);

            // Record decision
            state.decisions.push({
                round: state.currentRound,
                type: option.type,
                text: option.text,
                impact: option.impact
            });

            // Add to conversation
            state.conversationHistory.push({
                type: 'attorney',
                text: option.text
            });
            state.conversationHistory.push({
                type: 'client',
                text: option.response
            });

            // Update timeline
            updateTimelineStep(state.currentRound, option.type);

            // Track SCORM
            const finalScore = calculateFinalScore();
            SCORM.setScore(finalScore);
            SCORM.setSuspendData(JSON.stringify(state));

            // Show feedback
            showFeedback(option);
        }

        // Update Timeline Step
        function updateTimelineStep(stepNum, type) {
            const stepEl = document.getElementById(`step-${stepNum}`);
            const labelEl = document.getElementById(`step-label-${stepNum}`);
            const detailEl = document.getElementById(`step-detail-${stepNum}`);

            stepEl.classList.remove('active');
            labelEl.classList.remove('active');

            if (type === 'validation') {
                stepEl.classList.add('completed');
                labelEl.classList.add('completed');
                detailEl.textContent = 'Validación ✓';
            } else if (type === 'clarification') {
                stepEl.classList.add('completed');
                detailEl.textContent = 'Clarificación';
            } else if (type === 'premature' || type === 'direct') {
                stepEl.classList.add('failed');
                labelEl.classList.add('failed');
                detailEl.textContent = type === 'premature' ? 'Prematura ✗' : 'Directa';
            }

            // Activate next step
            if (stepNum < state.totalRounds) {
                const nextStep = document.getElementById(`step-${stepNum + 1}`);
                const nextLabel = document.getElementById(`step-label-${stepNum + 1}`);
                if (nextStep) {
                    nextStep.classList.add('active');
                    nextLabel.classList.add('active');
                }
            }
        }

        // Show Feedback
        function showFeedback(option) {
            const conversationHTML = generateConversationHTML();

            const content = `
                <div style="display: grid; grid-template-columns: 1fr 280px; gap: 25px;">
                    <div class="case-container">
                        ${conversationHTML}

                        <div class="feedback-box ${option.feedback.type}">
                            <div class="feedback-header">
                                <span class="feedback-icon">${option.feedback.type === 'positive' ? '✅' : option.feedback.type === 'negative' ? '❌' : '⚠️'}</span>
                                <h4 class="feedback-title">${option.feedback.title}</h4>
                            </div>
                            <div style="display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 15px; background: ${option.type === 'validation' ? 'rgba(5, 150, 105, 0.2)' : option.type === 'clarification' ? 'rgba(59, 130, 246, 0.2)' : option.type === 'direct' ? 'rgba(217, 119, 6, 0.2)' : 'rgba(220, 38, 38, 0.2)'}; color: ${option.type === 'validation' ? '#059669' : option.type === 'clarification' ? '#3b82f6' : option.type === 'direct' ? '#d97706' : '#dc2626'};">
                                ${getTypeLabel(option.type)}
                            </div>
                            <div class="feedback-content">
                                <p><strong>Análisis:</strong> ${option.feedback.content}</p>
                            </div>
                            <div class="feedback-impact">
                                <strong>Impacto:</strong> ${option.feedback.impact}
                            </div>
                        </div>

                        <div class="btn-container">
                            <button class="btn btn-primary" onclick="nextRound()">
                                Continuar →
                            </button>
                        </div>
                    </div>

                    ${generateClientStatePanel()}
                </div>
            `;

            document.getElementById('main-content').innerHTML = content;
            updateStats();
        }

        // Next Round
        function nextRound() {
            state.currentRound++;
            loadRound();
        }

        // Generate Client State Panel
        function generateClientStatePanel() {
            const infoItems = Object.entries(state.infoCollected)
                .filter(([key, value]) => value)
                .map(([key, value]) => {
                    const labels = {
                        abuseAfter2010: 'Maltrato post-2010',
                        sexualCoercion: 'Coerción sexual',
                        domesticServitude: 'Servidumbre doméstica',
                        threats: 'Amenazas',
                        economicControl: 'Control económico',
                        childAbuse: 'Maltrato al hijo'
                    };
                    return `<div style="background: rgba(5, 150, 105, 0.1); padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 8px; border-left: 3px solid #059669;">✓ ${labels[key]}</div>`;
                }).join('');

            const validationCount = state.decisions.filter(d => d.type === 'validation').length;
            const clarificationCount = state.decisions.filter(d => d.type === 'clarification').length;
            const directCount = state.decisions.filter(d => d.type === 'direct').length;
            const prematureCount = state.decisions.filter(d => d.type === 'premature').length;

            return `
                <div style="display: flex; flex-direction: column; gap: 20px;">
                    <!-- Estado Emocional del Cliente -->
                    <div style="background: #2d3748; border-radius: 15px; padding: 20px; border: 1px solid rgba(212, 175, 55, 0.2);">
                        <h3 style="color: #e2e8f0; font-size: 1rem; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;">
                            📊 Estado Emocional del Cliente
                        </h3>
                        
                        <!-- Confianza -->
                        <div style="margin-bottom: 18px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <span style="font-size: 0.85rem; color: #94a3b8;">Confianza</span>
                                <span style="font-size: 1.1rem; font-weight: 700; color: #059669;">${state.trust}%</span>
                            </div>
                            <div style="height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden;">
                                <div style="height: 100%; background: linear-gradient(90deg, #059669, #10b981); width: ${state.trust}%; transition: width 0.6s ease; border-radius: 10px;"></div>
                            </div>
                        </div>

                        <!-- Frustración -->
                        <div style="margin-bottom: 18px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <span style="font-size: 0.85rem; color: #94a3b8;">Frustración</span>
                                <span style="font-size: 1.1rem; font-weight: 700; color: #dc2626;">${state.frustration}%</span>
                            </div>
                            <div style="height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden;">
                                <div style="height: 100%; background: linear-gradient(90deg, #dc2626, #ef4444); width: ${state.frustration}%; transition: width 0.6s ease; border-radius: 10px;"></div>
                            </div>
                        </div>

                        <!-- Cooperación -->
                        <div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <span style="font-size: 0.85rem; color: #94a3b8;">Cooperación</span>
                                <span style="font-size: 1.1rem; font-weight: 700; color: #3b82f6;">${state.cooperation}%</span>
                            </div>
                            <div style="height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden;">
                                <div style="height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); width: ${state.cooperation}%; transition: width 0.6s ease; border-radius: 10px;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Información Recopilada -->
                    <div style="background: #2d3748; border-radius: 15px; padding: 20px; border: 1px solid rgba(212, 175, 55, 0.2);">
                        <h3 style="color: #e2e8f0; font-size: 1rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                            ✅ Información Recopilada
                        </h3>
                        ${infoItems || '<p style="color: #64748b; font-size: 0.85rem;">No se ha identificado información clave aún.</p>'}
                    </div>

                    <!-- Tu Estrategia -->
                    <div style="background: #2d3748; border-radius: 15px; padding: 20px; border: 1px solid rgba(212, 175, 55, 0.2);">
                        <h3 style="color: #e2e8f0; font-size: 1rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                            📈 Tu Estrategia
                        </h3>
                        <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
                            <span style="font-size: 0.85rem; color: #94a3b8;">Validación Emocional</span>
                            <span style="font-weight: 700; color: #059669;">${validationCount}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
                            <span style="font-size: 0.85rem; color: #94a3b8;">Clarificación</span>
                            <span style="font-weight: 700; color: #3b82f6;">${clarificationCount}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
                            <span style="font-size: 0.85rem; color: #94a3b8;">Enfoque Directo</span>
                            <span style="font-weight: 700; color: #d97706;">${directCount}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 8px 0;">
                            <span style="font-size: 0.85rem; color: #94a3b8;">Prematura</span>
                            <span style="font-weight: 700; color: #dc2626;">${prematureCount}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Generate Conversation HTML
        function generateConversationHTML() {
            return state.conversationHistory.map(msg => {
                if (msg.type === 'attorney') {
                    return `
                        <div class="message">
                            <div class="message-label" style="color: #059669;">ABOGADO - TÚ</div>
                            <div class="attorney-message">
                                <p class="message-text">${msg.text}</p>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="message">
                            <div class="message-label" style="color: #3b82f6;">CLIENTE - ${caseData.clientName}</div>
                            <div class="client-message">
                                <p class="message-text">${msg.text}</p>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        // Get Type Label
        function getTypeLabel(type) {
            const labels = {
                validation: 'Validación Emocional',
                clarification: 'Clarificación Cuidadosa',
                direct: 'Enfoque Directo',
                premature: 'Profundización Prematura'
            };
            return labels[type] || type;
        }

        // Calculate Final Score
        function calculateFinalScore() {
            const trustScore = state.trust;
            const frustrationPenalty = state.frustration;
            const cooperationScore = state.cooperation;
            const infoScore = Object.values(state.infoCollected).filter(v => v).length * 10;
            
            const totalScore = (trustScore + cooperationScore + infoScore + state.score - frustrationPenalty) / 3;
            return Math.max(0, Math.min(100, Math.round(totalScore)));
        }

        // Update Stats
        function updateStats() {
            document.getElementById('stat-pregunta').textContent = `${state.currentRound}/${state.totalRounds}`;
            document.getElementById('stat-puntos').textContent = state.score;
            document.getElementById('stat-correctas').textContent = state.correctCount;
            document.getElementById('stat-erroneas').textContent = state.wrongCount;

            // Update progress circle
            const percentage = Math.round(state.progress);
            document.getElementById('progress-percentage').textContent = percentage + '%';
            
            const circumference = 377;
            const offset = circumference - (percentage / 100) * circumference;
            document.getElementById('progress-circle').style.strokeDashoffset = offset;
        }

        // Show Results
        function showResults() {
            const finalScore = calculateFinalScore();
            const visaTIdentified = Object.values(state.infoCollected).filter(v => v).length >= 3;
            
            let verdict, verdictIcon, description;

            if (finalScore >= 80 && visaTIdentified && state.trust >= 70) {
                verdict = 'Desempeño Sólido';
                verdictIcon = '🏆';
                description = 'Excelente manejo de la entrevista. Generaste confianza, identificaste elementos clave de Visa T, y acordaste siguientes pasos claros.';
            } else if (finalScore >= 60 && visaTIdentified) {
                verdict = 'Desempeño Adecuado';
                verdictIcon = '✅';
                description = 'Lograste identificar oportunidad de Visa T, pero hubo momentos de fricción emocional que podrían haberse manejado mejor.';
            } else if (finalScore >= 40) {
                verdict = 'En Riesgo';
                verdictIcon = '⚠️';
                description = 'Obtuviste alguna información pero la relación con el cliente quedó frágil. Riesgo de que no continúe con el proceso.';
            } else {
                verdict = 'Requiere Desarrollo';
                verdictIcon = '❌';
                description = 'La cliente terminó más frustrada que al inicio. Es probable que busque otra firma o abandone el caso.';
            }

            const infoItems = Object.entries(state.infoCollected)
                .filter(([key, value]) => value)
                .map(([key, value]) => {
                    const labels = {
                        abuseAfter2010: 'Maltrato posterior a entrada 2010',
                        sexualCoercion: 'Coerción sexual documentada',
                        domesticServitude: 'Servidumbre doméstica y control',
                        threats: 'Amenazas y control psicológico',
                        economicControl: 'Control económico total',
                        childAbuse: 'Maltrato también hacia hijo menor'
                    };
                    return `<li>${labels[key]}</li>`;
                }).join('');

            const content = `
                <div class="results-container">
                    <div class="results-header">
                        <div class="results-icon">${verdictIcon}</div>
                        <h2 class="results-title">Simulación Completada</h2>
                        <h3 class="results-verdict">${verdict}</h3>
                        <p class="results-description">${description}</p>
                        <div class="results-score-display">${finalScore}/100</div>
                    </div>

                    <div class="results-section">
                        <h3>📊 Estado Final del Cliente</h3>
                        <ul>
                            <li><strong>Confianza:</strong> ${state.trust}% ${state.trust >= 70 ? '✅ Alta' : state.trust >= 40 ? '⚠️ Media' : '❌ Baja'}</li>
                            <li><strong>Frustración:</strong> ${state.frustration}% ${state.frustration <= 30 ? '✅ Baja' : state.frustration <= 60 ? '⚠️ Media' : '❌ Alta'}</li>
                            <li><strong>Cooperación:</strong> ${state.cooperation}% ${state.cooperation >= 70 ? '✅ Alta' : state.cooperation >= 40 ? '⚠️ Media' : '❌ Baja'}</li>
                        </ul>
                    </div>

                    <div class="results-section">
                        <h3>✅ Elementos de Visa T Identificados</h3>
                        ${infoItems ? `<ul>${infoItems}</ul>` : '<p>No se identificaron elementos suficientes de Visa T.</p>'}
                    </div>

                    <div class="results-section">
                        <h3>🎯 ¿Visa T Identificada como Viable?</h3>
                        <p><strong>${visaTIdentified ? 'SÍ ✓' : 'NO ✗'}</strong></p>
                        <p>${visaTIdentified ? 
                            'Con base en la información recopilada, la cliente es candidata potencial para Visa T. Los elementos identificados (coerción sexual, servidumbre doméstica, control) cumplen con indicadores de trata de personas.' : 
                            'No se recopiló suficiente información para determinar elegibilidad de Visa T. Se necesitaban al menos 3 indicadores de trata.'
                        }</p>
                    </div>

                    <div class="results-section">
                        <h3>📈 Tu Estrategia de Comunicación</h3>
                        <ul>
                            <li><strong>Validación Emocional:</strong> ${state.decisions.filter(d => d.type === 'validation').length} veces - ${state.decisions.filter(d => d.type === 'validation').length >= 4 ? 'Excelente ✅' : state.decisions.filter(d => d.type === 'validation').length >= 2 ? 'Adecuado ⚠️' : 'Insuficiente ❌'}</li>
                            <li><strong>Clarificación Cuidadosa:</strong> ${state.decisions.filter(d => d.type === 'clarification').length} veces</li>
                            <li><strong>Enfoque Directo:</strong> ${state.decisions.filter(d => d.type === 'direct').length} veces ${state.decisions.filter(d => d.type === 'direct').length >= 3 ? '⚠️ Alto riesgo' : ''}</li>
                            <li><strong>Profundización Prematura:</strong> ${state.decisions.filter(d => d.type === 'premature').length} veces ${state.decisions.filter(d => d.type === 'premature').length >= 2 ? '❌ Crítico' : ''}</li>
                        </ul>
                    </div>

                    <div class="btn-container" style="margin-top: 40px;">
                        <button class="btn btn-primary" onclick="init()">
                            Intentar Nuevamente
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('main-content').innerHTML = content;

            // Complete SCORM
            SCORM.setScore(finalScore);
            SCORM.complete();
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
