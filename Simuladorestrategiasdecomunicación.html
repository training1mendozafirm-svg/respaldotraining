    <script>
/**
 * SCORM 1.2 API Wrapper
 * Simulador de Atención al Cliente - TMLF
 */

var SCORM = {
    API: null,
    initialized: false,
    finishCalled: false,

    findAPI: function(win) {
        var findAttempts = 0;
        var findAttemptLimit = 500;
        
        while ((win.API == null) && (win.parent != null) && (win.parent != win)) {
            findAttempts++;
            if (findAttempts > findAttemptLimit) {
                return null;
            }
            win = win.parent;
        }
        return win.API;
    },

    getAPI: function() {
        var theAPI = this.findAPI(window);
        if ((theAPI == null) && (window.opener != null) && (typeof(window.opener) != "undefined")) {
            theAPI = this.findAPI(window.opener);
        }
        if (theAPI == null) {
            console.log("SCORM API no encontrada - modo standalone");
        }
        return theAPI;
    },

    init: function() {
        if (this.initialized) return true;
        
        this.API = this.getAPI();
        
        if (this.API == null) {
            console.log("Ejecutando en modo standalone (sin LMS)");
            this.initialized = true;
            return true;
        }

        var result = this.API.LMSInitialize("");
        
        if (result == "true" || result == true) {
            this.initialized = true;
            this.API.LMSSetValue("cmi.core.lesson_status", "incomplete");
            this.API.LMSCommit("");
            console.log("SCORM inicializado correctamente");
            return true;
        } else {
            console.log("Error al inicializar SCORM");
            return false;
        }
    },

    setProgress: function(progress) {
        if (this.API == null) {
            console.log("Progreso (standalone): " + progress + "%");
            return true;
        }
        
        this.API.LMSSetValue("cmi.core.lesson_location", progress.toString());
        this.API.LMSCommit("");
        return true;
    },

    setScore: function(score) {
        if (this.API == null) {
            console.log("Puntuación (standalone): " + score + "%");
            return true;
        }

        this.API.LMSSetValue("cmi.core.score.min", "0");
        this.API.LMSSetValue("cmi.core.score.max", "100");
        this.API.LMSSetValue("cmi.core.score.raw", score.toString());
        
        if (score >= 67) {
            this.API.LMSSetValue("cmi.core.lesson_status", "passed");
        } else {
            this.API.LMSSetValue("cmi.core.lesson_status", "failed");
        }
        
        this.API.LMSCommit("");
        console.log("Puntuación guardada: " + score + "%");
        return true;
    },

    complete: function() {
        if (this.finishCalled) return true;
        
        if (this.API == null) {
            console.log("Curso completado (standalone)");
            this.finishCalled = true;
            return true;
        }

        // No sobreescribimos lesson_status aquí — ya fue establecido como passed/failed por setScore()
        // Solo marcamos exit y hacemos commit
        this.API.LMSSetValue("cmi.core.exit", "");
        this.API.LMSCommit("");
        
        var result = this.API.LMSFinish("");
        this.finishCalled = true;
        
        console.log("Simulación completada y finalizada");
        return (result == "true" || result == true);
    },

    setSuspendData: function(data) {
        if (this.API == null) {
            localStorage.setItem('scorm_roleplay_data', data);
            return true;
        }
        
        this.API.LMSSetValue("cmi.suspend_data", data);
        this.API.LMSCommit("");
        return true;
    },

    getSuspendData: function() {
        if (this.API == null) {
            return localStorage.getItem('scorm_roleplay_data') || "";
        }
        
        return this.API.LMSGetValue("cmi.suspend_data");
    },

    getLastError: function() {
        if (this.API == null) return "0";
        return this.API.LMSGetLastError();
    },

    getErrorString: function(errorCode) {
        if (this.API == null) return "";
        return this.API.LMSGetErrorString(errorCode);
    }
};

window.onbeforeunload = function() {
    if (SCORM.initialized && !SCORM.finishCalled) {
        if (SCORM.API != null) {
            SCORM.API.LMSSetValue("cmi.core.exit", "suspend");
            SCORM.API.LMSCommit("");
            SCORM.API.LMSFinish("");
        }
    }
};

window.onunload = function() {
    if (SCORM.initialized && !SCORM.finishCalled && SCORM.API != null) {
        SCORM.API.LMSFinish("");
    }
};

</script>

        // Start simulation function
        function startSimulation() {
            simulatorState.currentScene = 1;
            loadScene();
            document.getElementById('next-btn').classList.remove('hidden');
        }

        // Load scene
        function loadScene() {
            const scene = scenes[simulatorState.currentScene];
            const contentArea = document.getElementById('content-area');
            
            // Load content
            if (typeof scene.content === 'function') {
                contentArea.innerHTML = scene.content();
            } else {
                contentArea.innerHTML = scene.content;
            }
            
            contentArea.classList.add('fade-in');
            
            // Initialize interactions if scene has options
            if (scene.hasOptions) {
                // Clonar botón submit para limpiar listeners acumulados de escenas anteriores
                const oldSubmit = document.getElementById('submit-answer');
                if (oldSubmit) {
                    const newSubmit = oldSubmit.cloneNode(true);
                    oldSubmit.parentNode.replaceChild(newSubmit, oldSubmit);
                }
                initializeSceneInteractions(scene);
                simulatorState.answered = false;
            } else {
                simulatorState.answered = true;
            }
            
            updateNavigationButtons();
            updateDashboard();
            
            // Update SCORM progress
            const progress = Math.round((simulatorState.currentScene / (scenes.length - 1)) * 100);
            SCORM.setProgress(progress);
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize scene interactions
        function initializeSceneInteractions(scene) {
            const options = document.querySelectorAll(`#options-${scene.id} .option-card`);
            const submitBtn = document.getElementById('submit-answer');
            let selectedOption = null;
            
            options.forEach(option => {
                option.addEventListener('click', () => {
                    options.forEach(opt => opt.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedOption = option;
                    if (submitBtn) submitBtn.disabled = false;
                });
            });
            
            if (submitBtn) {
                submitBtn.addEventListener('click', () => {
                    if (selectedOption) {
                        showFeedback(scene, selectedOption);
                        submitBtn.disabled = true;
                        options.forEach(opt => opt.style.pointerEvents = 'none');
                        simulatorState.answered = true;
                        document.getElementById('next-btn').disabled = false;
                    }
                });
            }
        }

        // Show feedback
        function showFeedback(scene, selectedOption) {
            const optionValue = selectedOption.dataset.option;
            const optionPoints = parseInt(selectedOption.dataset.points);
            const feedback = scene.feedback[optionValue];
            
            // Update score
            simulatorState.totalScore += optionPoints;
            if (optionPoints >= 15) simulatorState.correctAnswers++;
            
            // Calculate percentage for SCORM
            const scorePercentage = Math.round((simulatorState.totalScore / simulatorState.maxScore) * 100);
            SCORM.setScore(scorePercentage);
            
            // Record decision
            simulatorState.decisions.push({
                scene: scene.title,
                option: optionValue,
                points: optionPoints
            });
            
            // Show feedback
            const feedbackContainer = document.getElementById(`feedback-${scene.id}`);
            if (feedbackContainer && feedback) {
                feedbackContainer.innerHTML = `
                    <div class="feedback-header">
                        <span class="feedback-icon">${feedback.icon}</span>
                        <h3 class="feedback-title">${feedback.title}</h3>
                        <span class="feedback-score ${feedback.scoreClass}">+${optionPoints} puntos</span>
                    </div>
                    ${feedback.content}
                `;
                feedbackContainer.classList.add('show');
                feedbackContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            // Mark option
            if (optionPoints >= 15) {
                selectedOption.classList.add('correct');
            } else if (optionPoints === 0) {
                selectedOption.classList.add('incorrect');
            }
            
            updateDashboard();
        }

        // Update navigation buttons
        function updateNavigationButtons() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            
            if (simulatorState.currentScene === 0) {
                prevBtn.style.display = 'none';
                nextBtn.classList.add('hidden');
            } else if (simulatorState.currentScene === scenes.length) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'block';
                nextBtn.classList.remove('hidden');
                
                if (simulatorState.currentScene === scenes.length - 1) {
                    nextBtn.textContent = 'Ver Resultados';
                } else {
                    nextBtn.textContent = 'Siguiente →';
                }
            }
            
            // Disable next if decision not made
            if (scenes[simulatorState.currentScene] && scenes[simulatorState.currentScene].hasOptions && !simulatorState.answered) {
                nextBtn.disabled = true;
            } else {
                nextBtn.disabled = false;
            }
        }

        // Navigation functions
        function nextScene() {
            if (simulatorState.currentScene === scenes.length - 1) {
                showResults();
            } else if (simulatorState.currentScene < scenes.length - 1) {
                simulatorState.currentScene++;
                loadScene();
            }
        }

        function prevScene() {
            if (simulatorState.currentScene > 1) {
                simulatorState.currentScene--;
                loadScene();
            }
        }

        // Show results
        function showResults() {
            const level = calculateLevel(simulatorState.totalScore);
            const contentArea = document.getElementById('content-area');
            const scorePercentage = Math.round((simulatorState.totalScore / simulatorState.maxScore) * 100);
            
            // Complete SCORM
            SCORM.setScore(scorePercentage);
            SCORM.complete();
            
            // Update final scene counter
            simulatorState.currentScene = scenes.length;
            
            let html = `
                <div class="results-container">
                    <h2>¡Simulación Completada!</h2>
                    <div class="circular-progress">
                        <svg width="200" height="200">
                            <circle class="progress-ring-circle" cx="100" cy="100" r="90" />
                            <circle class="progress-ring-circle-fill" cx="100" cy="100" r="90" 
                                    style="stroke-dasharray: 565.48; stroke-dashoffset: ${565.48 - (565.48 * scorePercentage / 100)};" />
                        </svg>
                        <div class="progress-text">${scorePercentage}%</div>
                        <div class="progress-label">Progreso General</div>
                    </div>
                    <div class="results-score">${simulatorState.totalScore}/75 puntos</div>
                    <div class="results-level">${level.title}</div>
                    <p style="font-size: 1.2rem; color: #cbd5e1;">${level.description}</p>
                </div>
                
                <div class="results-details">
                    <h3>📊 Análisis de tu Desempeño</h3>
                    ${generateSceneResults()}
                    ${generateRecommendations(level)}
                </div>
            `;
            
            contentArea.innerHTML = html;
            updateNavigationButtons();
            updateDashboard();
        }

        function calculateLevel(score) {
            if (score >= 70) {
                return {
                    title: '🌟 EXPERTO EN MANEJO DE CALL BACKS',
                    description: 'Dominio excepcional de competencias críticas'
                };
            } else if (score >= 50) {
                return {
                    title: '✅ COMPETENTE CON ÁREAS DE MEJORA',
                    description: 'Base sólida con oportunidades de crecimiento'
                };
            } else if (score >= 30) {
                return {
                    title: '⚠️ BÁSICO - REQUIERE ENTRENAMIENTO',
                    description: 'Gaps significativos en competencias'
                };
            } else {
                return {
                    title: '❌ NECESITA DESARROLLO FUNDAMENTAL',
                    description: 'Requiere entrenamiento formal inmediato'
                };
            }
        }

        function generateSceneResults() {
            let html = '<h4 style="color: #f0b928; margin: 25px 0 15px 0;">Resultados por Escena:</h4>';
            
            simulatorState.decisions.forEach((decision) => {
                html += `
                    <div class="scene-result">
                        <h4>${decision.scene}</h4>
                        <p>Opción elegida: <strong>${decision.option}</strong></p>
                        <p><strong style="color: #f0b928;">Puntos obtenidos: ${decision.points}/15</strong></p>
                    </div>
                `;
            });
            
            return html;
        }

        function generateRecommendations(level) {
            let recommendations = [];
            
            if (level.title.includes('EXPERTO')) {
                recommendations = [
                    'Considera mentorar a otros abogados en técnicas de comunicación',
                    'Documenta tus mejores prácticas para materiales de entrenamiento',
                    'Lidera workshops sobre manejo de casos VAWA y Visa T'
                ];
            } else if (level.title.includes('COMPETENTE')) {
                recommendations = [
                    'Practica el enfoque "Plan A/Plan B" en todas las consultas',
                    'Valida siempre la emoción ANTES de dar soluciones legales',
                    'Revisa casos de Visa T para identificar señales de trata',
                    'Observa consultas de abogados senior'
                ];
            } else {
                recommendations = [
                    'Participa como oyente en consultas reales con supervisión',
                    'Estudia los elementos legales de Visa T vs VAWA',
                    'Practica role-plays de situaciones de crisis',
                    'No realices call backs independientes hasta completar entrenamiento'
                ];
            }
            
            let html = `
                <div class="recommendations">
                    <h3>📋 Recomendaciones para tu Desarrollo</h3>
                    <ul>
            `;
            
            recommendations.forEach(rec => {
                html += `<li>${rec}</li>`;
            });
            
            html += `
                    </ul>
                </div>
            `;
            
            return html;
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            loadScene();
            updateDashboard();
            
            document.getElementById('prev-btn').addEventListener('click', prevScene);
            document.getElementById('next-btn').addEventListener('click', nextScene);
        });
    </script>
