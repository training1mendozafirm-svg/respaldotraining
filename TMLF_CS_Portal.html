<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Service Operations Portal — TMLF</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f11;--sf:#16181c;--sf2:#1d1f24;--sf3:#24272e;--bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.13);--tx:#e8e9eb;--tx2:#9b9da4;--tx3:#55575f;--gold:#c9a84c;--gl:#e8c96a;--gd:rgba(201,168,76,0.14);--gb:rgba(201,168,76,0.28);--red:#e05252;--rd:rgba(224,82,82,0.13);--rb:rgba(224,82,82,0.3);--amb:#d4853a;--ad:rgba(212,133,58,0.13);--tel:#3aada4;--td:rgba(58,173,164,0.11);--r:10px;--rl:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:16px;line-height:1.6;overflow:hidden}
.hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:fixed;top:0;left:0;right:0;z-index:200}
.hdr-l{display:flex;align-items:center;gap:10px}
.logo{width:52px;height:52px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;background:#000}
.htitle{font-family:'Playfair Display',serif;font-weight:700;font-size:22px;letter-spacing:0.01em}
.hsub{font-size:11px;color:var(--tx3)}
.hbadge{font-size:9px;background:var(--gd);color:var(--gold);border:1px solid var(--gb);padding:2px 7px;border-radius:20px;font-weight:500}
.lay{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 52px);margin-top:52px}
.side{background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;display:flex;flex-direction:column}
.side::-webkit-scrollbar{width:3px}
.side::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
.sw{padding:10px 12px;border-bottom:1px solid var(--bd)}
.si{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:7px 12px 7px 36px;color:var(--tx);font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
.si:focus{border-color:var(--bd2)}
.si::placeholder{color:var(--tx3)}
.sr{position:relative}
.sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--tx3);pointer-events:none;display:flex;align-items:center}
.sh{padding:10px 14px 5px;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-family:'Playfair Display',serif}
.sdiv{height:1px;background:var(--bd);margin:4px 0}
.tb{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:6px 14px;display:flex;align-items:flex-start;gap:8px;color:var(--tx2);transition:all .1s}
.tb:hover{background:var(--sf2);color:var(--tx)}
.tb.act{background:var(--gd);color:var(--gl)}
.tb.emg .ti{color:var(--red)}
.tb.emg:hover{color:#ff9090}
.tb.emg.act{background:var(--rd);color:#ff9090}
.ti{font-size:17px;flex-shrink:0;width:20px;text-align:center;margin-top:2px}
.tl{font-size:16px;flex:1;line-height:1.4}
.tb.act .tl{font-weight:500}
.ta{font-size:12px;transition:transform .15s;color:var(--tx3);margin-top:3px;flex-shrink:0}
.ta.op{transform:rotate(90deg)}
.tc{display:none}
.tc.op{display:block}
.mn{overflow-y:auto;background:var(--bg)}
.mn::-webkit-scrollbar{width:4px}
.mn::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
.wlc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;gap:14px;color:var(--tx3);padding:24px}
.wlc-i{font-size:44px;opacity:.25}
.wlc h2{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--tx2)}
.wlc p{font-size:16px;max-width:400px;line-height:1.7}
.cp{padding:24px 28px;animation:fi .15s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.ph{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--bd)}
.pi{width:42px;height:42px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pi.gold{background:var(--gd);color:var(--gold)}
.pi.red{background:var(--rd);color:var(--red)}
.pi.teal{background:var(--td);color:var(--tel)}
.pi.amber{background:var(--ad);color:var(--amb)}
.ptitle{font-family:'Playfair Display',serif;font-weight:700;font-size:28px;color:var(--tx);line-height:1.2}
.psub{font-size:14px;color:var(--tx3);margin-top:3px}
.eb{background:var(--rd);border:1px solid var(--rb);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:15px;color:#ff9090;font-weight:500}
.sl{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-family:'Playfair Display',serif;margin:20px 0 10px}
.sp{background:var(--sf);border:1px solid var(--gb);border-left:3px solid var(--gold);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;margin-bottom:18px}
.spl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-family:'Playfair Display',serif;margin-bottom:8px}
.spt{font-size:16px;color:var(--tx2);font-style:italic;line-height:1.7}
.spt strong{font-style:normal;color:var(--tx);font-weight:500}
.sts{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.st{display:flex;gap:11px;align-items:flex-start;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;transition:border-color .1s}
.st:hover{border-color:var(--bd2)}
.sn{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:'Playfair Display',serif;margin-top:1px}
.sn.blue{background:rgba(58,134,255,.15);color:#6ab4ff}
.sn.red{background:var(--rd);color:var(--red)}
.sn.amber{background:var(--ad);color:var(--amb)}
.sn.teal{background:var(--td);color:var(--tel)}
.sti{font-size:16px;font-weight:500;color:var(--tx);margin-bottom:3px}
.sdi{font-size:15px;color:var(--tx2);line-height:1.6}
.sdi strong{color:var(--tx);font-weight:500}
.rb{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:14px 16px;margin-bottom:18px}
.rbt{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);font-family:'Playfair Display',serif;margin-bottom:10px}
.ri{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--bd);font-size:15px;color:var(--tx2);line-height:1.6}
.ri:last-child{border-bottom:none;padding-bottom:0}
.rd{width:4px;height:4px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:7px}
.rd.red{background:var(--red)}
.rd.teal{background:var(--tel)}
.ac{margin-bottom:10px}
.ab{width:100%;text-align:left;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:11px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;color:var(--tx);font-size:15px;font-weight:500;font-family:'DM Sans',sans-serif;transition:all .12s}
.ab:hover{background:var(--sf3);border-color:var(--bd2)}
.ab.op{border-color:var(--bd2);border-bottom-left-radius:0;border-bottom-right-radius:0}
.atag{font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600;font-family:'Playfair Display',serif;letter-spacing:.05em;flex-shrink:0}
.atag.gold{background:var(--gd);color:var(--gold)}
.atag.red{background:var(--rd);color:var(--red)}
.atag.teal{background:var(--td);color:var(--tel)}
.atag.amber{background:var(--ad);color:var(--amb)}
.aarr{font-size:13px;color:var(--tx3);transition:transform .15s;flex-shrink:0;margin-left:8px}
.ab.op .aarr{transform:rotate(180deg)}
.aby{background:var(--sf);border:1px solid var(--bd2);border-top:none;border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r);padding:14px 16px;display:none}
.aby.op{display:block}
.asl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);font-family:'Playfair Display',serif;margin:12px 0 7px}
.asl:first-child{margin-top:0}
.asp{background:var(--sf2);border-left:2px solid var(--gold);padding:10px 13px;border-radius:0 6px 6px 0;font-size:15px;color:var(--tx2);font-style:italic;line-height:1.65;margin-bottom:10px}
.asp strong{font-style:normal;color:var(--tx);font-weight:500}
.ari{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:15px;color:var(--tx2);line-height:1.55;border-bottom:1px solid var(--bd)}
.ari:last-child{border-bottom:none}
.ard{width:3px;height:3px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:8px}
.astp{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--bd);font-size:15px}
.astp:last-child{border-bottom:none}
.asn{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;font-family:'Playfair Display',serif}
.asn.blue{background:rgba(58,134,255,.15);color:#6ab4ff}
.asn.red{background:var(--rd);color:var(--red)}
.asn.amber{background:var(--ad);color:var(--amb)}
.asn.teal{background:var(--td);color:var(--tel)}
.ast .t{font-weight:500;color:var(--tx);display:block;margin-bottom:2px}
.ast .d{color:var(--tx2);line-height:1.5}
.nores{padding:20px 14px;font-size:15px;color:var(--tx3);text-align:center}
.sh.sh-amb{background:rgba(201,168,76,0.15);border-radius:6px;margin:4px 8px 2px;padding:6px 10px;color:#c9a84c}
.sh.sh-blu{background:rgba(58,134,255,0.13);border-radius:6px;margin:4px 8px 2px;padding:6px 10px;color:#6ab4ff}
.sh.sh-red{background:rgba(224,82,82,0.13);border-radius:6px;margin:4px 8px 2px;padding:6px 10px;color:#e05252}
.sh.sh-grn{background:rgba(76,175,130,0.13);border-radius:6px;margin:4px 8px 2px;padding:6px 10px;color:#4caf82}

.tb.grn .ti{color:#4caf82}
.tb.grn:hover{color:#4caf82}
.tb.grn.act{background:rgba(76,175,130,.12);color:#4caf82}

.tb.blu .ti{color:#6ab4ff}
.tb.blu:hover{color:#6ab4ff}
.tb.blu.act{background:rgba(58,134,255,.12);color:#6ab4ff}

.tb.amb .ti{color:var(--gold)}
.tb.amb:hover{color:#ffd97a}
.tb.amb.act{background:var(--gd);color:var(--gl)}


body.light{
--bg:#f4f5f7;--sf:#ffffff;--sf2:#f0f1f3;--sf3:#e4e6ea;
--bd:rgba(0,0,0,0.09);--bd2:rgba(0,0,0,0.18);
--tx:#1a1c22;--tx2:#4a4d58;--tx3:#8a8d98;
--gd:rgba(160,110,20,0.10);--gb:rgba(160,110,20,0.25);
--rd:rgba(180,50,50,0.10);--rb:rgba(180,50,50,0.25);
--ad:rgba(170,95,20,0.10);--td:rgba(30,140,130,0.10);
}
body.light .hdr{background:#ffffff;border-bottom:1px solid rgba(0,0,0,0.1)}
body.light .side{background:#ffffff;border-right:1px solid rgba(0,0,0,0.09)}
body.light .mn{background:#f4f5f7}
body.light .sp{background:#fff8ec}
body.light .rb{background:#ffffff}
body.light .st{background:#ffffff}
body.light .ab{background:#f0f1f3}
body.light .ab:hover{background:#e4e6ea}
body.light .aby{background:#ffffff}
body.light .si{background:#f0f1f3;color:#1a1c22}

/* Toggle button */
.theme-toggle{background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:13px;font-family:'DM Sans',sans-serif;transition:all .15s}
.theme-toggle:hover{border-color:var(--bd2);color:var(--tx)}
.theme-toggle svg{flex-shrink:0}
</style>
