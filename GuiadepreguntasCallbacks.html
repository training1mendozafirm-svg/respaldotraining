/* =============================================
   GUÍA AMPLIACIÓN ESTRATÉGICA — TMLF

   ============================================= */

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap');

:root {
  --navy: #1B3A6B;
  --navy-dark: #122A52;
  --navy-light: #EBF2FA;
  --gold: #C9A84C;
  --gold-light: #FDF6E3;
  --white: #FFFFFF;
  --gray-50: #F8F9FA;

  --radius: 10px;
  --shadow: 0 2px 16px rgba(27,58,107,0.10);
  --shadow-lg: 0 8px 32px rgba(27,58,107,0.15);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Source Sans 3', sans-serif;
  background: var(--gray-100);
  color: var(--gray-800);
  font-size: 16px;
  line-height: 1.6;
}

/* =============================================
   LAYOUT
   ============================================= */
.app-shell {
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  background: var(--navy-dark);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  overflow-y: auto;
  z-index: 100;
}

.sidebar-header {
  padding: 24px 16px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.sidebar-logo {
  font-size: 22px;
  margin-bottom: 4px;
}

.sidebar-firm {
  font-family: 'Playfair Display', serif;
  color: var(--gold);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
  line-height: 1.3;
}

.sidebar-sub {
  color: rgba(255,255,255,0.45);
  font-size: 11px;
  margin-top: 2px;
}

.nav-items {
  list-style: none;
  padding: 12px 0;
  flex: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.2s;
  position: relative;
}

.nav-item:hover {
  background: rgba(255,255,255,0.07);
  border-left-color: rgba(201,168,76,0.4);
}

.nav-item.visited {
  opacity: 1;
}

.nav-item.active {
  background: rgba(201,168,76,0.12);
  border-left-color: var(--gold);
}

.nav-item.completed {
  opacity: 0.8;
}

.nav-icon {
  font-size: 16px;
  flex-shrink: 0;
}

.nav-label {
  color: rgba(255,255,255,0.75);
  font-size: 12px;
  line-height: 1.3;
  flex: 1;
}

.nav-item.active .nav-label { color: var(--gold); font-weight: 600; }

.nav-check {
  color: #4CAF50;
  font-size: 12px;
  font-weight: 700;
}

/* MAIN */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

#main-content {
  flex: 1;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  padding: 0 0 60px;
}

/* =============================================
   SECTION HEADER
   ============================================= */
.section-header {

  color: white;
  border-radius: 0 0 var(--radius) var(--radius);
  margin-bottom: 0;
}

.section-header-inner {
  display: flex;
  align-items: center;
  gap: 16px;
}

.section-big-icon {
  font-size: 36px;
  line-height: 1;
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 700;
  color: white;
  line-height: 1.2;
}

.section-badge {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.9);
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  margin-top: 6px;
  font-weight: 600;
  letter-spacing: 0.3px;
}

/* Progress dots */
.sub-progress {
  display: flex;
  gap: 6px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.2);
}

.sub-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transition: all 0.2s;
}
.sub-dot.active { background: white; transform: scale(1.3); }
.sub-dot.done { background: rgba(255,255,255,0.7); }

/* =============================================
   SECTION BODY
   ============================================= */
.section-body {
  padding: 28px 36px 32px;
  border-radius: 0 0 var(--radius) var(--radius);
  min-height: 400px;
  display: flex;
  flex-direction: column;
}

.sub-title {
  font-family: 'Playfair Display', serif;
  font-size: 19px;
  font-weight: 600;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--gray-200);
}

/* =============================================
   SCRIPT BOX
   ============================================= */
.script-box {
  background: white;
  border: 1px solid var(--gray-200);
  border-left: 4px solid var(--gold);
  border-radius: var(--radius);
  padding: 24px 28px;
  box-shadow: var(--shadow);
}

.script-box p {
  color: var(--gray-600);
  font-style: italic;
  margin-bottom: 12px;
  font-size: 14px;
}

.script-box blockquote {
  color: var(--gray-800);
  font-size: 15.5px;
  line-height: 1.75;
  font-style: normal;
  border: none;
  padding: 0;
}

.script-box blockquote strong {
  color: var(--navy);
}

/* =============================================
   QUESTIONS
   ============================================= */
.questions-list {

  flex-direction: column;
  gap: 12px;
}

.question-card {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  background: white;
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  padding: 16px 20px;

}

.question-card:hover {

}

.q-number {

  color: #92400E;
  margin-bottom: 16px;

   ============================================= */

.decision-card {

.decision-condition {

  font-weight: 600;

  border-radius: 6px;

/* =============================================

/* =============================================

   ============================================= */
.intro-screen {

.intro-card p { color: var(--gray-600); font-size: 13px; line-height: 1.5; }

  font-size: 16px;

  font-size: 36px;

.comp-stat label {

  color: var(--gray-600);
}

.completion-note {
  color: var(--gray-400);
  font-size: 13px;
  margin-bottom: 28px;
  font-style: italic;
}

/* =============================================
   SCROLLBAR
   ============================================= */
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

/* =============================================
   RESPONSIVE
   ============================================= */
@media (max-width: 720px) {
  :root { --sidebar-w: 200px; }
  .section-header, .section-body { padding: 20px; }
  .intro-cards { grid-template-columns: 1fr; }
  .intro-title { font-size: 22px; }
  .section-title { font-size: 17px; }
}

@media (max-width: 500px) {
  .sidebar { width: 60px; }
  .main { margin-left: 60px; }
  .nav-label, .nav-check, .sidebar-firm, .sidebar-sub { display: none; }
  .sidebar-header { padding: 12px 8px; }
}

// SCORM 1.2 API Wrapper
var SCORM = (function() {
  var API = null;
  var initialized = false;

  function findAPI(win) {
    var attempts = 0;
    while (win.API == null && win.parent != null && win.parent != win) {
      attempts++;
      if (attempts > 7) return null;
      win = win.parent;
    }
    return win.API;
  }

  function getAPI() {
    var win = window;
    var api = findAPI(win);
    if (!api && win.opener) api = findAPI(win.opener);
    return api;
  }

  function init() {
    API = getAPI();
    if (!API) {
      console.warn("SCORM API not found — running in standalone mode.");
      return false;
    }
    var result = API.LMSInitialize("");
    initialized = (result === "true" || result === true);
    return initialized;
  }

  function setValue(key, value) {
    if (!API || !initialized) return;
    API.LMSSetValue(key, value);
    API.LMSCommit("");
  }

  function getValue(key) {
    if (!API || !initialized) return "";
    return API.LMSGetValue(key);
  }

  function complete() {
    setValue("cmi.core.lesson_status", "completed");
    setValue("cmi.core.score.raw", "100");
    setValue("cmi.core.exit", "");
    if (API && initialized) {
      API.LMSFinish("");
    }
  }

  function markInProgress() {
    setValue("cmi.core.lesson_status", "incomplete");
  }

  return { init, setValue, getValue, complete, markInProgress };
})();

</script>

// =============================================
// STATE
// =============================================
let currentSection = 0;
let currentSub = 0;
let visitedSections = new Set([0]);
let completedSections = new Set();

// =============================================
// RENDER ENGINE
// =============================================

function renderNav() {
  const nav = document.getElementById('nav-items');
  nav.innerHTML = '';
  SECTIONS.forEach((sec, i) => {
    const li = document.createElement('li');
    li.className = 'nav-item' + (i === currentSection ? ' active' : '') + (completedSections.has(i) ? ' completed' : '') + (visitedSections.has(i) ? ' visited' : '');
    li.innerHTML = `
      <span class="nav-icon">${sec.icon}</span>
      <span class="nav-label">${sec.title.replace('\n', '<br>')}</span>
      ${completedSections.has(i) ? '<span class="nav-check">✓</span>' : ''}
    `;
    li.addEventListener('click', () => goToSection(i));
    nav.appendChild(li);
  });
}

function renderSection() {
  const sec = SECTIONS[currentSection];
  const main = document.getElementById('main-content');

  if (sec.type === 'intro') {
    main.innerHTML = renderIntro();
    return;
  }

  const colorMap = {
    navy: '#1B3A6B', orange: '#D4741A', blue: '#1A5276',
    purple: '#6C3483', red: '#922B21', crimson: '#7B241C',
    teal: '#0E6655', gold: '#7D6608'
  };
  const bgMap = {
    navy: '#EBF2FA', orange: '#FEF9EF', blue: '#EBF5FB',
    purple: '#F5EEF8', red: '#FDEDEC', crimson: '#FDEDEC',
    teal: '#E8F8F5', gold: '#FDFBE9'
  };

  const color = colorMap[sec.color] || '#1B3A6B';
  const bg = bgMap[sec.color] || '#F5F8FF';
  const subs = sec.subsections || [];
  const sub = subs[currentSub] || null;

  let progressHTML = '';
  if (subs.length > 1) {
    progressHTML = `<div class="sub-progress">
      ${subs.map((s,i) => `<div class="sub-dot ${i === currentSub ? 'active' : ''} ${i < currentSub ? 'done' : ''}" title="${s.title}"></div>`).join('')}
    </div>`;
  }

  let bodyHTML = '';
  if (sub) {
    if (sub.type === 'script') bodyHTML = renderScript(sub, color);
    else if (sub.type === 'questions') bodyHTML = renderQuestions(sub, color);
    else if (sub.type === 'decision') bodyHTML = renderDecision(sub);
  }

  main.innerHTML = `
    <div class="section-header" style="background: ${color}">
      <div class="section-header-inner">
        <span class="section-big-icon">${sec.icon}</span>
        <div>
          <div class="section-title">${sec.title.replace('\n', ' — ')}</div>
          ${sec.badge ? `<div class="section-badge">${sec.badge}</div>` : ''}
        </div>
      </div>
      ${progressHTML}
    </div>
    <div class="section-body" style="background: ${bg}">
      ${sub ? `<h2 class="sub-title" style="color:${color}">${sub.title}</h2>` : ''}
      ${bodyHTML}
      <div class="nav-buttons">
        ${currentSub > 0 || currentSection > 0 ? `<button class="btn btn-secondary" onclick="goBack()">← Anterior</button>` : '<div></div>'}
        <button class="btn btn-primary" style="background:${color}" onclick="goNext()">
          ${isLastStep() ? '✓ Finalizar Módulo' : 'Siguiente →'}
        </button>
      </div>
    </div>
  `;
}

function renderIntro() {
  return `
    <div class="intro-screen">
      <div class="intro-logo">⚖️</div>
      <div class="intro-firm">THE MENDOZA LAW FIRM</div>
      <div class="intro-area">PreCase — Área de Entrenamiento</div>
      <h1 class="intro-title">Guía de Ampliación y Fortalecimiento Estratégico</h1>
      <p class="intro-subtitle">Preguntas para la Redirección y Diversificación de Alivios Migratorios</p>
      <div class="intro-divider"></div>
      <div class="intro-cards">
        <div class="intro-card">
          <span>🎯</span>
          <strong>Objetivo</strong>
          <p>Ampliar la estrategia del caso identificando alivios migratorios adicionales mediante preguntas estructuradas.</p>
        </div>
        <div class="intro-card">
          <span>🗺️</span>
          <strong>Estructura</strong>
          <p>8 bloques temáticos con árboles de decisión para redirigir el caso al alivio correcto en cada etapa.</p>
        </div>
        <div class="intro-card">
          <span>📌</span>
          <strong>Uso</strong>
          <p>Consulta durante la llamada de segunda revisión con el cliente. Sigue las instrucciones de redirección en cada bloque.</p>
        </div>
      </div>
      <button class="btn btn-primary btn-large" onclick="goNext()">Comenzar Guía →</button>
    </div>
  `;
}

function renderScript(sub, color) {
  return `<div class="script-box">${sub.content}</div>`;
}

function renderQuestions(sub, color) {
  let html = '';
  if (sub.note) html += `<div class="note-box">📌 ${sub.note}</div>`;
  html += '<div class="questions-list">';
  sub.questions.forEach((q, i) => {
    html += `<div class="question-card">
      <div class="q-number" style="background:${color}">${i + 1}</div>
      <div class="q-text">${q}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderDecision(sub) {
  const colorMap = {
    green: { bg: '#E8F8F2', border: '#27AE60', text: '#1A6B3C', btn: '#27AE60' },
    orange: { bg: '#FEF5E7', border: '#E67E22', text: '#784212', btn: '#E67E22' },
    blue: { bg: '#EBF5FB', border: '#2E86C1', text: '#1B4F72', btn: '#2E86C1' },
    gray: { bg: '#F2F3F4', border: '#7F8C8D', text: '#2C3E50', btn: '#7F8C8D' },
    purple: { bg: '#F5EEF8', border: '#8E44AD', text: '#6C3483', btn: '#8E44AD' }
  };

  let html = '';
  if (sub.note) html += `<div class="note-box">📌 ${sub.note}</div>`;
  html += '<div class="decision-grid">';

  sub.branches.forEach(b => {
    const c = colorMap[b.color] || colorMap.blue;
    html += `<div class="decision-card" style="background:${c.bg}; border-color:${c.border}">
      <div class="decision-icon">${b.icon}</div>
      <div class="decision-condition" style="color:${c.text}">${b.condition}</div>
      ${b.subquestion ? `<div class="decision-sub">❓ ${b.subquestion}</div>` : ''}
      <div class="decision-action" style="background:${c.btn}">➤ ${b.action}</div>
    </div>`;
  });

  html += '</div>';
  return html;
}

// =============================================
// NAVIGATION
// =============================================

function goToSection(i) {
  completedSections.add(currentSection);
  currentSection = i;
  currentSub = 0;
  visitedSections.add(i);
  renderNav();
  renderSection();
  window.scrollTo(0, 0);
  SCORM.markInProgress();
}

function isLastStep() {
  const sec = SECTIONS[currentSection];
  const subs = (sec.subsections || []);
  return currentSection === SECTIONS.length - 1 && (subs.length === 0 || currentSub === subs.length - 1);
}

function goNext() {
  const sec = SECTIONS[currentSection];
  const subs = sec.subsections || [];

  if (subs.length > 0 && currentSub < subs.length - 1) {
    currentSub++;
    renderSection();
    window.scrollTo(0, 0);
    return;
  }

  completedSections.add(currentSection);

  if (currentSection < SECTIONS.length - 1) {
    currentSection++;
    currentSub = 0;
    visitedSections.add(currentSection);
    renderNav();
    renderSection();
    window.scrollTo(0, 0);
    SCORM.markInProgress();
  } else {
    completedSections.add(currentSection);
    renderNav();
    showCompletion();
    SCORM.complete();
  }
}

function goBack() {
  const sec = SECTIONS[currentSection];
  if (currentSub > 0) {
    currentSub--;
    renderSection();
    window.scrollTo(0, 0);
    return;
  }
  if (currentSection > 0) {
    currentSection--;
    const prevSec = SECTIONS[currentSection];
    currentSub = (prevSec.subsections || []).length - 1;
    if (currentSub < 0) currentSub = 0;
    renderNav();
    renderSection();
    window.scrollTo(0, 0);
  }
}

function showCompletion() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="completion-screen">
      <div class="completion-icon">✅</div>
      <h1>Guía Completada</h1>
      <p>Has revisado todos los bloques de la guía de ampliación estratégica.</p>
      <div class="completion-summary">
        <div class="comp-stat"><span>${SECTIONS.length}</span><label>Bloques revisados</label></div>
        <div class="comp-stat"><span>${completedSections.size}</span><label>Secciones completadas</label></div>
      </div>
      <p class="completion-note">Este módulo ha sido registrado como completado en Moodle.</p>
      <button class="btn btn-primary btn-large" onclick="restartModule()">↺ Revisar desde el inicio</button>
    </div>
  `;
}

function restartModule() {
  currentSection = 0;
  currentSub = 0;
  visitedSections = new Set([0]);
  completedSections = new Set();
  renderNav();
  renderSection();
  window.scrollTo(0, 0);
}

// =============================================
// INIT
// =============================================
document.addEventListener('DOMContentLoaded', () => {
  SCORM.init();
  renderNav();
  renderSection();
});

</script>
